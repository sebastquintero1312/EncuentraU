# Blueprint de despliegue de EncuentraU v2.0 en Render.com (servicio web gratuito).
#
# La base de datos NO está en Render: es PostgreSQL de Supabase (la base
# gratuita de Render se borra a los 30 días). Ver docs/DEPLOYMENT.md.
#
# Uso: en Render, "New > Blueprint", conectar este repositorio. Las variables
# marcadas con "sync: false" las pide Render la primera vez y se escriben a
# mano en el panel: son secretos o dependen de las cuentas externas.
#
# La migración (flask db upgrade) NO se ejecuta aquí: la aplicación se conecta
# con encuentrau_app, que no tiene permiso para crear tablas. Se ejecuta aparte
# con el usuario dueño (DATABASE_URL_MIGRACIONES), ver docs/DEPLOYMENT.md.
#
# Gunicorn: 1 proceso con 4 hilos. Flask-Limiter guarda los contadores en
# memoria del proceso; con un solo proceso los límites de peticiones son exactos.

services:
  - type: web
    name: encuentrau
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT 'app:create_app()'"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Render pone delante un proxy (1 salto): necesario para conocer la IP
      # real del cliente (límite de peticiones) y que la app sepa que va por HTTPS.
      - key: NUM_PROXIES
        value: "1"
      - key: DOMINIO_CORREO_INSTITUCIONAL
        value: sanmateo.edu.co
      - key: CORREO_PROVEEDOR
        value: brevo
      - key: CORREO_REMITENTE_NOMBRE
        value: EncuentraU
      # URL del pooler de Supabase (modo Session, puerto 5432) con el usuario
      # encuentrau_app y ?sslmode=require. Nunca la del usuario dueño.
      - key: DATABASE_URL
        sync: false
      # https://<servicio>.onrender.com (la app no arranca sin https://).
      - key: URL_PUBLICA
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      # FRONTEND_ORIGIN no es necesaria: frontend y API se sirven desde el
      # mismo servicio (mismo origen).
