<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EncuentraU - Solicitud de recuperación</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="panel-ciudadano.html" class="logo"><img src="img/logo-sanmateo.png" alt="Logo EncuentraU" class="logo-img">EncuentraU</a>
      <nav class="nav-links">
        <a href="panel-ciudadano.html">Panel</a>
        <a href="reportar-perdido.html">Reportar perdido</a>
        <a href="reportar-encontrado.html">Reportar encontrado</a>
        <a href="mis-reportes.html">Mis reportes</a>
        <a href="buscar-objetos.html">Buscar objetos</a>
        <a href="index.html">Cerrar sesión</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-card ancho">
      <h2>Solicitud de recuperación</h2>
      <p class="subtitulo" id="nombre-objeto"></p>
      <p class="subtitulo">Esta información de verificación solo la verán el dueño del reporte y un administrador; nunca se hace pública.</p>

      <div class="mensaje-general-error" id="mensaje-general-error"></div>

      <form id="form-solicitud" novalidate>
        <div class="form-group">
          <label for="contacto">Correo o teléfono de contacto</label>
          <input type="text" id="contacto" placeholder="Ej: [email protected]">
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="mensaje">¿Por qué crees que este objeto es tuyo?</label>
          <textarea id="mensaje" rows="4" placeholder="Da detalles que ayuden a confirmar que el objeto es tuyo"></textarea>
          <span class="mensaje-error"></span>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Enviar solicitud</button>
      </form>

      <div class="mensaje-confirmacion" id="mensaje-confirmacion"></div>
    </div>
  </main>

  <footer class="footer">
    <p>EncuentraU &copy; 2026 — Proyecto universitario</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/main.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/pagina-solicitud-recuperacion.js"></script>
</body>
</html>
