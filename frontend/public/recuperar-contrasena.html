<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña · EncuentraU</title>
  <link rel="icon" href="img/logo-sanmateo.png">
  <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-acceso="invitado">
  <header id="encabezado"></header>

  <main class="acceso">
    <section class="lado-marca">
      <i class="fa-solid fa-unlock-keyhole icono-fondo" aria-hidden="true"></i>
      <span class="etiqueta-seccion">Recuperar acceso</span>
      <h1>¿Olvidaste tu <span>contraseña</span>?</h1>
      <p>Te enviaremos a tu correo institucional un enlace de un solo uso para crear una nueva. Vence en 30 minutos.</p>
    </section>

    <section class="lado-formulario">
      <div class="tarjeta-acceso">
        <h2>Recuperar contraseña</h2>
        <div id="mensaje" class="alerta" aria-live="polite"></div>
        <form id="form-recuperar" class="formulario mt-2" novalidate>
          <div class="campo form-group">
            <label for="correo">Correo institucional</label>
            <input type="email" id="correo" name="correo" maxlength="255" autocomplete="username" required>
            <span class="mensaje-error"></span>
          </div>
          <button type="submit" class="boton boton-primario boton-bloque" id="boton-recuperar">
            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Enviarme el enlace
          </button>
        </form>
        <div class="enlaces-acceso">
          <a href="login.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver a iniciar sesión</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="pie"></footer>

  <script src="js/validaciones.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pagina-recuperar.js"></script>
</body>
</html>
