<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EncuentraU - Buscar objetos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="panel-ciudadano.html" class="logo"><img src="img/logo-sanmateo.png" alt="Logo EncuentraU" class="logo-img">EncuentraU</a>
      <nav class="nav-links">
        <a href="panel-ciudadano.html">Panel</a>
        <a href="reportar-perdido.html">Reportar perdido</a>
        <a href="reportar-encontrado.html">Reportar encontrado</a>
        <a href="mis-reportes.html">Mis reportes</a>
        <a href="buscar-objetos.html">Buscar objetos</a>
        <a href="index.html">Cerrar sesión</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 class="titulo-seccion">Buscar objetos</h2>
    <p class="subtitulo">Consulta todos los reportes de la universidad.</p>

    <div class="filtros">
      <div class="form-group">
        <label for="texto">Buscar por nombre</label>
        <input type="text" id="texto" placeholder="Ej: mochila, celular...">
      </div>
      <div class="form-group">
        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="">Todos</option>
          <option value="perdido">Perdido</option>
          <option value="encontrado">Encontrado</option>
        </select>
      </div>
      <div class="form-group">
        <label for="categoria">Categoría</label>
        <select id="categoria">
          <option value="">Todas</option>
          <option>Tecnología</option>
          <option>Accesorios</option>
          <option>Útiles</option>
          <option>Documentos</option>
          <option>Ropa</option>
          <option>Otro</option>
        </select>
      </div>
      <button id="btn-buscar" class="btn btn-primary">Buscar</button>
    </div>

    <div class="grid" id="resultados"></div>
  </main>

  <footer class="footer">
    <p>EncuentraU &copy; 2026 — Proyecto universitario</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pagina-buscar-objetos.js"></script>
</body>
</html>
