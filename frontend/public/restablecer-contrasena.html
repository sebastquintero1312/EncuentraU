<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- same-origin (no "no-referrer"): el token del enlace nunca se envía a
       otros sitios, pero la protección CSRF de Flask-WTF exige el Referer en
       HTTPS. El JS borra el token de la URL antes de hacer el POST. -->
  <meta name="referrer" content="same-origin">
  <title>Nueva contraseña · EncuentraU</title>
  <link rel="icon" href="img/logo-sanmateo.png">
  <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-acceso="publico">
  <header id="encabezado"></header>

  <main class="acceso">
    <section class="lado-marca">
      <i class="fa-solid fa-lock icono-fondo" aria-hidden="true"></i>
      <span class="etiqueta-seccion">Recuperar acceso</span>
      <h1>Crea una <span>contraseña</span> nueva</h1>
      <p>El enlace que abriste sirve una sola vez. Al guardar, tu contraseña anterior deja de funcionar.</p>
    </section>

    <section class="lado-formulario">
      <div class="tarjeta-acceso">
        <h2>Nueva contraseña</h2>
        <div id="mensaje" class="alerta" aria-live="polite"></div>
        <form id="form-restablecer" class="formulario mt-2" novalidate>
          <div class="campo form-group">
            <label for="contrasena">Contraseña nueva</label>
            <div class="campo-password">
              <input type="password" id="contrasena" name="contrasena" maxlength="128" autocomplete="new-password" required>
              <button type="button" class="btn-mostrar-password" id="btn-mostrar-contrasena">Mostrar</button>
            </div>
            <div class="medidor-fortaleza"><div class="barra" id="barra-fortaleza"></div></div>
            <span class="etiqueta-fortaleza" id="etiqueta-fortaleza"></span>
            <ul class="lista-requisitos" id="lista-requisitos"></ul>
            <span class="mensaje-error"></span>
          </div>
          <div class="campo form-group">
            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" name="confirmar_contrasena" maxlength="128" autocomplete="new-password" required>
            <span class="mensaje-error"></span>
          </div>
          <button type="submit" class="boton boton-primario boton-bloque" id="boton-guardar">
            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Guardar contraseña
          </button>
        </form>
        <div class="enlaces-acceso">
          <a href="login.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Volver a iniciar sesión</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="pie"></footer>

  <script src="js/validaciones.js"></script>
  <script src="js/contrasena-fortaleza.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pagina-restablecer.js"></script>
</body>
</html>
