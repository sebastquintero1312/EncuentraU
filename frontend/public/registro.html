<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EncuentraU - Registrarse</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo"><img src="img/logo-sanmateo.png" alt="Logo EncuentraU" class="logo-img">EncuentraU</a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="login.html">Iniciar sesión</a>
        <a href="registro.html">Registrarse</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-card ancho">
      <img src="img/logo-sanmateo.png" alt="Logo EncuentraU" class="logo-form">
      <h2>Crear cuenta</h2>
      <p class="subtitulo-form">Regístrate con tu correo institucional</p>

      <div class="mensaje-general-error" id="mensaje-general-error"></div>

      <form id="form-registro" novalidate>
        <div class="form-group">
          <label for="primerNombre">Primer nombre</label>
          <input type="text" id="primerNombre">
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="segundoNombre">Segundo nombre (opcional)</label>
          <input type="text" id="segundoNombre">
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="primerApellido">Primer apellido</label>
          <input type="text" id="primerApellido">
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="segundoApellido">Segundo apellido (opcional)</label>
          <input type="text" id="segundoApellido">
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="correo">Correo institucional</label>
          <input type="email" id="correo" autocomplete="username">
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <div class="campo-password">
            <input type="password" id="contrasena" autocomplete="new-password">
            <button type="button" class="btn-mostrar-password" id="btn-mostrar-contrasena">Mostrar</button>
          </div>
          <div class="medidor-fortaleza"><div class="barra" id="barra-fortaleza"></div></div>
          <span class="etiqueta-fortaleza" id="etiqueta-fortaleza"></span>
          <ul class="lista-requisitos" id="lista-requisitos"></ul>
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="confirmar">Confirmar contraseña</label>
          <div class="campo-password">
            <input type="password" id="confirmar" autocomplete="new-password">
            <button type="button" class="btn-mostrar-password" id="btn-mostrar-confirmar">Mostrar</button>
          </div>
          <span class="mensaje-error"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-registro" style="width:100%">Registrarme</button>
      </form>

      <div class="form-links">
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>EncuentraU &copy; 2026 — Proyecto universitario</p>
  </footer>

  <script src="js/validaciones.js"></script>
  <script src="js/contrasena-fortaleza.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pagina-registro.js"></script>
</body>
</html>
