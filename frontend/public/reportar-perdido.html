<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EncuentraU - Reportar objeto perdido</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-tipo-reporte="perdido">

  <header class="navbar">
    <div class="nav-container">
      <a href="panel-ciudadano.html" class="logo"><img src="img/logo-sanmateo.png" alt="Logo EncuentraU" class="logo-img">EncuentraU</a>
      <nav class="nav-links">
        <a href="panel-ciudadano.html">Panel</a>
        <a href="reportar-perdido.html">Reportar perdido</a>
        <a href="reportar-encontrado.html">Reportar encontrado</a>
        <a href="mis-reportes.html">Mis reportes</a>
        <a href="buscar-objetos.html">Buscar objetos</a>
        <a href="index.html">Cerrar sesión</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-card ancho">
      <h2>Reportar objeto perdido</h2>

      <div class="mensaje-general-error" id="mensaje-general-error"></div>

      <form id="form-reporte" novalidate>
        <div class="form-group">
          <label for="nombreObjeto">Nombre del objeto</label>
          <input type="text" id="nombreObjeto" placeholder="Ej: Mochila azul">
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="categoria">Categoría</label>
          <select id="categoria">
            <option value="">Selecciona una categoría</option>
            <option>Tecnología</option>
            <option>Accesorios</option>
            <option>Útiles</option>
            <option>Documentos</option>
            <option>Ropa</option>
            <option>Otro</option>
          </select>
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="4" placeholder="Describe el objeto con el mayor detalle posible"></textarea>
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="ubicacion">Lugar donde lo perdiste</label>
          <input type="text" id="ubicacion" placeholder="Ej: Biblioteca central">
          <span class="mensaje-error"></span>
        </div>
        <div class="form-group">
          <label for="fecha">Fecha aproximada</label>
          <input type="date" id="fecha">
          <span class="mensaje-error"></span>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Enviar reporte</button>
      </form>

      <div class="mensaje-confirmacion" id="mensaje-confirmacion">
        Tu reporte fue registrado correctamente.
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>EncuentraU &copy; 2026 — Proyecto universitario</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/main.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/pagina-reportar.js"></script>
</body>
</html>
